<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Bus Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .transit-yellow { background-color: #f6e05e; }
        .transit-navy { background-color: #1a202c; }
        .next-bus { border: 3px solid #f6e05e; background-color: #fefce8; }
        .dark .next-bus { background-color: #422004; border-color: #f6e05e; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <div class="max-w-md mx-auto p-4 pb-20">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 mt-4">
            <h1 class="text-2xl font-bold tracking-tight">UTS <span class="text-blue-600">Bus</span></h1>
            <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block"></i>
            </button>
        </header>

        <!-- Direction Toggle -->
        <div class="mb-6">
            <label class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">Direction</label>
            <div class="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl">
                <button id="dir-b2b" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-white dark:bg-gray-700 shadow-sm" data-dir="broadway_to_botany">
                    Broadway &rarr; Botany
                </button>
                <button id="dir-b2b_rev" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400" data-dir="botany_to_broadway">
                    Botany &rarr; Broadway
                </button>
            </div>
        </div>

        <!-- Station Selection -->
        <div class="mb-6 p-4 rounded-2xl bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700">
            <div class="mb-4">
                <label class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4 block">My Stop</label>
                <div id="stop-selector" class="flex items-start justify-between relative px-2">
                    <!-- Interactive stop map injected here -->
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">Alert Me (mins before)</label>
                    <div class="relative">
                        <input type="number" id="alert-mins" value="5" min="0" max="60" class="w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400">min</span>
                    </div>
                </div>
                <button id="btn-notify-perm" class="w-full sm:w-auto px-4 py-3 rounded-xl bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 text-xs font-bold uppercase transition-all hover:bg-blue-200 dark:hover:bg-blue-900/50 flex items-center justify-center gap-2">
                    <i class="fas fa-bell"></i> Enable Alerts
                </button>
            </div>
        </div>


        <!-- Current Time Display -->
        <div class="mb-6 text-center">
            <p class="text-xs text-gray-500 dark:text-gray-400 uppercase font-medium">Current Time</p>
            <p id="current-time" class="text-3xl font-bold tabular-nums">--:-- --</p>
            <button id="btn-live-map" class="mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold uppercase transition-all active:scale-95 shadow-md">
                <i class="fas fa-map-marker-alt"></i> Track Live Bus
            </button>
        </div>

        <!-- Schedule List -->
        <div class="mb-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold">Upcoming Departures</h2>
                <div id="next-bus-badge" class="hidden px-2 py-1 rounded-full bg-yellow-200 dark:bg-yellow-800 text-yellow-800 dark:text-yellow-200 text-xs font-bold uppercase">
                    Next Bus
                </div>
            </div>
            <div id="schedule-list" class="space-y-3">
                <!-- Trips will be injected here -->
                <div class="animate-pulse space-y-3">
                    <div class="h-20 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
                    <div class="h-20 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
                    <div class="h-20 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Trip Detail Modal -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transition-all transform scale-95 opacity-0" id="modal-content">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 id="modal-trip-time" class="text-3xl font-bold">--:--</h3>
                        <p id="modal-direction" class="text-sm text-gray-500 dark:text-gray-400">--</p>
                    </div>
                    <button id="close-modal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="modal-stops" class="space-y-4 relative">
                    <!-- Stops will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Live Map Modal -->
    <div id="map-modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-0 bg-black/80 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-900 w-full h-full flex flex-col transition-all transform translate-y-full" id="map-content">
            <div class="p-4 flex justify-between items-center border-b dark:border-gray-800 bg-white dark:bg-gray-900">
                <h3 class="font-bold text-lg">Live Bus Tracking</h3>
                <button id="close-map" class="p-2 text-gray-500 hover:text-gray-800 dark:hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="flex-1 relative">
                <iframe
                    id="live-map-frame"
                    src=""
                    class="absolute inset-0 w-full h-full border-none"
                    allow="geolocation"
                ></iframe>
                <!-- Fallback message if iframe is blocked -->
                <div id="map-fallback" class="hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-gray-100 dark:bg-gray-800">
                    <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-4"></i>
                    <p class="text-gray-600 dark:text-gray-300 mb-4">The map provider blocked the embedded view.</p>
                    <a href="https://maps.busminder.com.au/route/live/a6d25365-6b07-4546-9d4f-52ea8d1785e4" target="_blank" class="px-6 py-2 bg-blue-600 text-white rounded-full font-bold">Open Map in New Tab</a>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
